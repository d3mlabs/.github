# Reusable: add a repo's newly opened issues to the D3M Labs Multi-Project
# View (org project 5), the planning board that spans every d3mlabs repo.
#
# GitHub's built-in "Auto-add to project" workflow is one repo per workflow
# and capped per plan (5 on Team), so it cannot feed the board from the whole
# org. This workflow does it from Actions instead: each participating repo
# adds a ~10-line caller (see README) that fires on `issues: opened`.
#
# Writes to an org project need a token carrying `organization_projects:
# write`; GITHUB_TOKEN never does. The call authenticates as the d3mlabs-bot
# GitHub App (org secrets D3MLABS_BOT_APP_ID / _PRIVATE_KEY, granted to the
# participating repos), minting a per-run token scoped to the calling repo.
name: add-to-project

on:
  workflow_call:
    secrets:
      D3MLABS_BOT_APP_ID:
        required: true
      D3MLABS_BOT_PRIVATE_KEY:
        required: true

env:
  PROJECT_OWNER: d3mlabs
  PROJECT_NUMBER: 5

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Mint project token (d3mlabs-bot)
        id: project-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.D3MLABS_BOT_APP_ID }}
          private-key: ${{ secrets.D3MLABS_BOT_PRIVATE_KEY }}
          owner: ${{ env.PROJECT_OWNER }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read

      - name: Add the opened issue
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/${{ env.PROJECT_OWNER }}/projects/${{ env.PROJECT_NUMBER }}
          github-token: ${{ steps.project-token.outputs.token }}
