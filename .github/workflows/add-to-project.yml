# Reusable: add a repo's newly opened issues to the D3M Labs Multi-Project
# View (org project 5), the planning board that spans every d3mlabs repo.
#
# GitHub's built-in "Auto-add to project" workflow is one repo per workflow
# and capped per plan (5 on Team), so it cannot feed the board from the whole
# org. This workflow does it from Actions instead: each participating repo
# adds a ~10-line caller (see README) that fires on `issues: opened`.
#
# The board is a statement of intent, not an inbox: only issues opened by
# someone with triage or higher access to the repo, or by the ai-flow App
# (its /split sub-issues are planning items), are added. Drive-by issues on
# the public repos stay in the repo for triage; the ones worth planning get
# added by hand or by becoming a sub-issue of a plan. The gate asks GitHub
# for the author's repo role rather than reading the event's
# `author_association`: that field is computed for the receiving app, and a
# private org membership reads as a non-member to Actions (it skipped the
# org owner). An org member holding only the org base permission (read) is
# not added either.
#
# Writes to an org project need a token carrying `organization_projects:
# write`; GITHUB_TOKEN never does. The call authenticates as the d3mlabs-bot
# GitHub App (org secrets D3MLABS_BOT_APP_ID / _PRIVATE_KEY, granted to the
# participating repos), minting a per-run token. Its repository permissions
# are scoped to the calling repo; the projects permission is org-wide by
# nature (GitHub has no per-project scoping), so the token can write to any
# d3mlabs project for the minute it lives.
name: add-to-project

on:
  workflow_call:
    secrets:
      D3MLABS_BOT_APP_ID:
        required: true
      D3MLABS_BOT_PRIVATE_KEY:
        required: true

# GITHUB_TOKEN keeps metadata:read, which is all the access lookup needs;
# the App token below is the only credential that writes.
permissions: {}

env:
  PROJECT_OWNER: d3mlabs
  PROJECT_NUMBER: 5

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      # Apps never hold a repo role, so the ai-flow bot is allowed by login.
      # A user who is not a collaborator at all resolves to `none`.
      - name: Resolve the author's access to this repo
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "d3mlabs-ai-flow[bot]" ]; then
            role=ai-flow
          else
            role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .role_name 2>/dev/null || echo none)
          fi
          case "$role" in
            admin|maintain|write|triage|ai-flow) allowed=true ;;
            *) allowed=false ;;
          esac
          echo "author=$AUTHOR role=$role allowed=$allowed"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Mint project token (d3mlabs-bot)
        if: steps.author.outputs.allowed == 'true'
        id: project-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.D3MLABS_BOT_APP_ID }}
          private-key: ${{ secrets.D3MLABS_BOT_PRIVATE_KEY }}
          owner: ${{ env.PROJECT_OWNER }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read

      - name: Add the opened issue
        if: steps.author.outputs.allowed == 'true'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/${{ env.PROJECT_OWNER }}/projects/${{ env.PROJECT_NUMBER }}
          github-token: ${{ steps.project-token.outputs.token }}
